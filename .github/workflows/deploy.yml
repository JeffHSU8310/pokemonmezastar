name: Pokemon Mezastar CI & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Camera Runtime
      run: |
        python - <<'PY'
        from importlib.metadata import packages_distributions
        import cv2
        import onnxruntime
        from rapidocr import RapidOCR
        from camera_recognizer import recognize_card
        from live_scanner import LiveCardScanner

        providers = set(packages_distributions().get("cv2", []))
        assert providers == {"opencv-python"}, f"cv2 套件衝突：{providers}"
        assert cv2.__version__ == "5.0.0"
        assert RapidOCR and recognize_card and LiveCardScanner and onnxruntime
        PY

    - name: Run Unit Tests
      run: |
        python -m unittest test_mezastar.py test_advanced_recommender.py test_recommendation_learning.py test_official_updates.py test_sync_reliability.py test_camera_recognizer.py test_live_scanner.py test_recognition_learning.py
